<!doctype html>
<html lang="en-GB"><head><meta name="flat-layout" content="1"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script>try{var t=localStorage.getItem("labs-theme");if(t)document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem("labs-term")==="white")document.documentElement.classList.add("tt-white");}catch(e){}</script><script>/* ============================================================
   Network topology symbols — shared across every activity.
   Original SVG drawings in the conventional Cisco/Packet Tracer
   topology style (functional diagram symbols). viewBox 0 0 64 64,
   device centred. Two-tone: light body + Cisco-blue outline, so
   they read on both light and dark stages.
   Use:  <svg viewBox="0 0 64 64">  + NETSYM[type]  </svg>
============================================================ */
(function(){
  // palette (fixed so icons look identical on every page/theme)
  var B='#cfe7f5',   // body fill
      L='#0a7cad',   // outline
      A='#0a9ad4',   // accent fill
      D='#07485f',   // deep accent
      W='#ffffff';
  function arrow(d){ return '<path d="'+d+'" fill="none" stroke="'+W+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'; }

  var S={};

  // ---- Router: 3-D cylinder with the classic 4-way arrows on top ----
  S.router =
   '<path d="M8 34 v4 a24 8 0 0 0 48 0 v-4" fill="'+L+'"/>'+
   '<ellipse cx="32" cy="34" rx="24" ry="8.5" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   // 4-way arrows (left,right,up,down) on the top face
   arrow('M20 34 h9 m-3.5 -3 l3.5 3 -3.5 3')+        // right
   arrow('M44 34 h-9 m3.5 -3 l-3.5 3 3.5 3')+        // left
   arrow('M32 27.5 v-3 M29.5 26 l2.5 -2.5 2.5 2.5')+ // up (small)
   arrow('M32 40.5 v3 M29.5 42 l2.5 2.5 2.5 -2.5');  // down (small)

  // ---- Switch: flat 3-D slab with 4 parallel arrows (2 each way) ----
  S['switch'] =
   '<path d="M10 30 L22 22 H58 L46 30 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+   // top face
   '<path d="M10 30 H46 V40 H10 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+          // front
   '<path d="M46 30 L58 22 V32 L46 40 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+    // side
   arrow('M16 33 h16 m-4 -2.5 l4 2.5 -4 2.5')+
   arrow('M40 37 h-16 m4 -2.5 l-4 2.5 4 2.5');

  // ---- Multilayer (L3) switch: slab + routing ring ----
  S.l3switch =
   '<path d="M10 32 L22 24 H58 L46 32 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M10 32 H46 V42 H10 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M46 32 L58 24 V34 L46 42 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   arrow('M16 35 h12 m-3.5 -2.5 l3.5 2.5 -3.5 2.5')+
   arrow('M40 39 h-12 m3.5 -2.5 l-3.5 2.5 3.5 2.5')+
   '<circle cx="47" cy="20" r="9" fill="'+W+'" stroke="'+L+'" stroke-width="2"/>'+
   arrow('M43 20 h8 m-2.5 -2.5 l2.5 2.5 -2.5 2.5').replace(/#ffffff/,L);

  // ---- PC / desktop: monitor + tower ----
  S.pc =
   '<rect x="12" y="14" width="34" height="24" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="16" y="18" width="26" height="16" rx="1" fill="'+A+'"/>'+
   '<rect x="25" y="38" width="8" height="5" fill="#9bbdd4"/>'+
   '<rect x="18" y="43" width="22" height="4" rx="2" fill="'+L+'"/>'+
   '<rect x="48" y="20" width="12" height="27" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<circle cx="54" cy="25" r="1.6" fill="'+L+'"/><path d="M51 42 h6" stroke="'+L+'" stroke-width="2"/>';

  // ---- Laptop ----
  S.laptop =
   '<path d="M16 16 h32 v20 h-32 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="19" y="19" width="26" height="14" rx="1" fill="'+A+'"/>'+
   '<path d="M10 44 L16 36 h32 l6 8 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M27 40 h10" stroke="'+L+'" stroke-width="2" stroke-linecap="round"/>';

  // ---- Server ----
  S.server =
   '<rect x="20" y="10" width="24" height="44" rx="3" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="24" y="15" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="18.5" r="1.4" fill="'+W+'"/>'+
   '<rect x="24" y="25" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="28.5" r="1.4" fill="'+W+'"/>'+
   '<rect x="24" y="35" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="38.5" r="1.4" fill="'+W+'"/>'+
   '<path d="M25 48 h14" stroke="'+L+'" stroke-width="2" stroke-linecap="round"/>';

  // ---- Firewall: brick wall ----
  S.firewall =
   '<rect x="8" y="16" width="48" height="32" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<g stroke="'+L+'" stroke-width="2">'+
   '<path d="M8 27 h48 M8 37 h48"/>'+
   '<path d="M24 16 v11 M40 16 v11"/>'+        // top row bricks
   '<path d="M16 27 v10 M32 27 v10 M48 27 v10"/>'+ // mid row offset
   '<path d="M24 37 v11 M40 37 v11"/>'+        // bottom row
   '</g>';

  // ---- Access point: puck + radio waves ----
  S.ap =
   '<ellipse cx="32" cy="42" rx="22" ry="7" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="30" y="20" width="4" height="18" rx="2" fill="'+L+'"/>'+
   '<circle cx="32" cy="18" r="3.5" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   '<g fill="none" stroke="'+A+'" stroke-width="2.4" stroke-linecap="round">'+
   '<path d="M22 14 a14 14 0 0 1 20 0"/><path d="M26 18 a9 9 0 0 1 12 0"/></g>';

  // ---- IP phone ----
  S.phone =
   '<path d="M18 12 h24 a4 4 0 0 1 4 4 v30 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 v-30 a4 4 0 0 1 4 -4 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="19" y="17" width="22" height="13" rx="1" fill="'+A+'"/>'+
   '<g fill="'+L+'"><circle cx="23" cy="36" r="2"/><circle cx="30" cy="36" r="2"/><circle cx="37" cy="36" r="2"/><circle cx="23" cy="43" r="2"/><circle cx="30" cy="43" r="2"/><circle cx="37" cy="43" r="2"/></g>';

  // ---- Printer ----
  S.printer =
   '<rect x="18" y="12" width="28" height="12" rx="1" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="10" y="24" width="44" height="18" rx="3" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="20" y="36" width="24" height="14" rx="1" fill="'+W+'" stroke="'+L+'" stroke-width="2"/>'+
   '<circle cx="48" cy="30" r="2" fill="'+W+'"/>';

  // ---- Cloud (internet / WAN) ----
  S.cloud =
   '<path d="M16 46 a12 12 0 0 1 1 -24 a15 14 0 0 1 28 -4 a12 12 0 0 1 4 28 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>';

  // ---- Hub: plain 3-D box with vertical slats (no arrows — it just repeats) ----
  S.hub =
   '<path d="M14 24 L24 17 H54 L44 24 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M14 24 H44 V46 H14 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M44 24 L54 17 V39 L44 46 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M20 29v12M26 29v12M32 29v12M38 29v12" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/>';

  // aliases
  S.multiswitch=S.l3switch; S.asa=S.firewall; S.internet=S.cloud; S.desktop=S.pc;

  window.NETSYM=S;
})();
</script>

<title>IDS/IPS Practical Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#f7f3e8; --panel:#fff; --ink:#2a2416; --muted:#6e6450; --line:#e8dcbd; --accent:#d9a51e; --accent-dark:#8c6400; --accent-soft:#fdf1c7;
  --ok:#1a9c5b; --oks:#e7f6ec; --bad:#d23d3d; --bads:#fbe9e9; --warn:#e68a00;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --display:"Chivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130d;--panel:#1f1c14;--ink:#f1ead8;--muted:#b3a98f;--line:#3a3424;--accent:#f2c94c;--accent-dark:#f7d978;--accent-soft:#3d3110;--oks:#13331f;--bads:#3a1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130d;--panel:#1f1c14;--ink:#f1ead8;--muted:#b3a98f;--line:#3a3424;--accent:#f2c94c;--accent-dark:#f7d978;--accent-soft:#3d3110;--oks:#13331f;--bads:#3a1c1c;color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--ink)}body{margin:0;font:14px/1.5 var(--display)}
button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:18px 16px 44px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
h1{font:800 clamp(24px,4vw,32px)/1.05 var(--display);margin:6px 0 0}
.lead{color:var(--muted);margin:8px 0 0;max-width:76ch}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font:800 18px var(--display);margin:0 0 4px}.card h3{font:700 12px var(--display);margin:14px 0 6px;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.04em}
.ref{font-size:13.5px}
.btn{font:600 13px var(--display);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.primary:hover{background:var(--accent-dark)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font:600 12px var(--mono);color:var(--muted)}

.app.wide{max-width:1560px}
.ids-hide{display:none!important}
.mono{font-family:var(--mono)}
.ids-sub{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.ids-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.ids-seg button{border:0;background:transparent;padding:8px 13px;font:600 13px var(--display);cursor:pointer;color:var(--ink)}
.ids-seg button+button{border-left:1px solid var(--line)}
.ids-seg button.on{background:var(--accent);color:var(--on-accent)}
.ids-pill{display:inline-block;font:600 11.5px var(--mono);border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.ids-pill.ok{border-color:var(--ok);color:var(--ok);background:var(--oks)}
.ids-pill.bad{border-color:var(--bad);color:var(--bad);background:var(--bads)}

.ids-in,.ids-sel{font:600 13.5px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.ids-sel{font-family:var(--display);cursor:pointer}
.ids-in.ok,.ids-sel.ok{border-color:var(--ok);background:var(--oks)}

/* ===================== configure tab ===================== */
.ids-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ids-bar .sp{flex:1}
.ids-task{margin-top:12px}
.ids-task h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ids-brief{font-size:13.5px;margin:4px 0 8px;max-width:110ch}
.ids-objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:7px}
.ids-obj{border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 34px;position:relative;font-size:13px;background:var(--panel)}
.ids-obj::before{content:"";position:absolute;left:10px;top:9px;width:15px;height:15px;border-radius:50%;border:2px solid var(--line)}
.ids-obj.done{border-color:var(--ok);background:var(--oks)}
.ids-obj.done::before{background:var(--ok);border-color:var(--ok)}
.ids-obj.done::after{content:"✓";position:absolute;left:13px;top:6px;color:#fff;font:800 12px var(--display)}
.ids-obj.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ids-obj b{font-weight:700}
.ids-obj .auto{font:600 10.5px var(--mono);color:var(--accent-dark);margin-left:6px}
.ids-obj details{margin-top:4px}
.ids-obj summary{cursor:pointer;color:var(--accent-dark);font:600 12px var(--display)}
.ids-obj .why{color:var(--muted);font-size:12.5px;margin:3px 0}
.ids-cmds{font:600 12.5px/1.55 var(--mono);background:#071a0e;color:#9dffc2;border-radius:7px;padding:7px 10px;margin-top:5px;white-space:pre;overflow-x:auto}
.ids-done{display:none;margin-top:10px;border:1px solid var(--ok);background:var(--oks);border-radius:10px;padding:10px 14px}
.ids-done.show{display:block}
.ids-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:1050px){.ids-grid{grid-template-columns:1fr}}
.ids-tcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}
.ids-thead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font:700 13px var(--display)}
.ids-thead .sp{flex:1}
.ids-ib{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;font:600 12px var(--display);cursor:pointer;color:var(--ink)}
.ids-ib:hover{border-color:var(--accent)}
.ids-stage{position:relative;background:radial-gradient(circle,rgba(150,110,10,.13) 1px,transparent 1.3px) 0 0/22px 22px,var(--panel)}
.ids-svg{display:block;width:100%;height:670px;touch-action:none;cursor:grab;user-select:none}
.ids-svg.panning{cursor:grabbing}
.ids-svg .nd{cursor:move}
.ids-svg text{font-family:var(--display)}
.ids-svg .nm{font:700 12px var(--display);fill:var(--ink)}
.ids-svg .ip{font:600 10.5px var(--mono);fill:var(--muted)}
.ids-svg .zl{font:800 12px var(--display);letter-spacing:.08em}
.ids-svg .zi{font:600 11px var(--mono)}
.ids-svg .pl{font:700 10px var(--mono);fill:var(--muted)}
.ids-tcard:fullscreen{border-radius:0;display:flex;flex-direction:column}
.ids-tcard:fullscreen .ids-stage{flex:1}.ids-tcard:fullscreen .ids-svg{height:100%}
.ids-cap{min-height:44px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;display:flex;align-items:center;gap:8px}
.ids-cap .ic{font-size:18px}
.ids-cap.ok{background:var(--oks)}.ids-cap.no{background:var(--bads)}
.ids-test{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.ids-test .ids-f{flex:1 1 190px}
.ids-log{max-height:190px;overflow:auto;border-top:1px solid var(--line);font:500 12px/1.5 var(--mono);padding:6px 12px}
.ids-log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.ids-log .ok{color:var(--ok)}.ids-log .no{color:var(--bad)}
/* console window */
.ids-con{display:flex;flex-direction:column;height:720px;width:100%;background:#071a0e;resize:vertical!important}
.ids-con .win-bar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font:700 12.5px var(--display)}
.ids-con .win-bar .sp{flex:1}
.ids-con .win-bar button{border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.55);border-radius:5px;padding:3px 8px;font:600 11.5px var(--display);cursor:pointer;color:#13314e}
.ids-term{flex:1;overflow:auto;padding:10px 12px;font:500 13.5px/1.45 var(--mono);background:#071a0e;color:#45dd68;cursor:text}
.ids-term .ln{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
.ids-irow{display:flex;align-items:baseline}
.ids-irow .ps1{white-space:pre;color:#88ffb0}
.ids-irow input{flex:1;border:0;outline:0;background:transparent;font:inherit;padding:0;color:#45dd68;caret-color:#45dd68;min-width:40px}
.ids-keys{font:500 11.5px var(--display);color:var(--muted);padding:6px 2px 0}
.ids-keys kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.ids-res{width:100%;border-collapse:collapse;font-size:12.5px}
.ids-res th{text-align:left;font:700 10.5px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 7px}
.ids-res td{border-bottom:1px solid var(--line);padding:5px 7px}
.ids-res td.m{font:600 12px var(--mono)}
.ids-res .pass{color:var(--ok);font-weight:800}.ids-res .fail{color:var(--bad);font-weight:800}
.ids-req{margin:4px 0 8px;padding-left:20px;font-size:13.5px}
.ids-req li{margin:3px 0}
.ids-req li.met{color:var(--ok)}

.ids-term .l-bad{color:#ff8575}.ids-term .l-warn{color:#ecc06a}.ids-term .l-dim{color:#7fae8c}

/* ===================== IDS / IPS lab extras ===================== */
:root{--amber:#d97a00;--ambers:#fff3df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--amber:#f0a030;--ambers:#3a2a10}}
:root[data-theme="dark"]{--amber:#f0a030;--ambers:#3a2a10}
/* configure */
.ids-seg-sm button{padding:5px 10px;font-size:12px}
.ids-svg{height:700px}
.ids-svg .st{font:700 10.5px var(--mono)}
.ids-atk{border-top:1px solid var(--line);padding:10px 12px}
.ids-atk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.ids-atk-h .sp{flex:1}
.ids-spd{font:600 12px var(--display);color:var(--muted);display:flex;align-items:center;gap:6px}
.ids-spd .ids-sel{width:auto;padding:5px 7px}
.ids-atk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:7px}
.ids-ab{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 9px;cursor:pointer;font:700 13px/1.25 var(--display);color:var(--ink)}
.ids-ab:hover{border-color:var(--bad)}
.ids-ab .ic{font-size:17px;line-height:1}
.ids-ab small{display:block;font:500 11px/1.3 var(--mono);color:var(--muted);margin-top:2px}
.ids-ab.ok{border-left:4px solid var(--ok)}.ids-ab.ok:hover{border-color:var(--ok)}
.ids-ab.atk{border-left:4px solid var(--bad)}
.ids-ab:disabled{opacity:.55;cursor:default}
.ids-alcard{margin-top:14px;padding:12px}
.ids-alwrap{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.ids-al{width:100%;border-collapse:collapse;font-size:12.5px}
.ids-al th{position:sticky;top:0;background:var(--panel);text-align:left;font:700 10.5px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 7px;z-index:1}
.ids-al td{border-bottom:1px solid var(--line);padding:5px 7px;vertical-align:top}
.ids-al td.m{font:600 11.5px var(--mono);white-space:nowrap}
.ids-al td.msg{font-weight:700}
.ids-al tr.new td{animation:idsFlash 1.4s}
@keyframes idsFlash{from{background:var(--ambers)}to{background:transparent}}
.ids-al .empty{color:var(--muted);text-align:center;padding:16px}
.ids-act-p{display:inline-block;font:800 10.5px var(--mono);border-radius:999px;padding:2px 8px;color:#fff;background:var(--amber);white-space:nowrap}
.ids-act-p.drop{background:var(--bad)}.ids-act-p.ids{background:var(--amber);box-shadow:inset 0 0 0 2px var(--bad)}
/* terminal window (GNOME-style title bar) */
.ids-twin{display:flex;flex-direction:column;height:760px;border-radius:10px 10px 6px 6px;overflow:hidden;border:1px solid #1b1b1b;box-shadow:0 18px 40px rgba(0,0,0,.35);resize:vertical;min-height:380px;background:#071a0e}
.ids-tbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#3a3a3a,#2b2b2b);color:#eee;font:700 12.5px var(--display);position:relative;min-height:36px}
.ids-ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font:600 13px var(--display);color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 120px}
.ids-tbtn{position:relative;z-index:1;border:1px solid #555;background:#454545;color:#eee;border-radius:6px;padding:3px 9px;font:600 11.5px var(--display);cursor:pointer;user-select:none}
.ids-tbtn:hover{background:#565656}
.ids-wb{margin-left:auto;display:flex;gap:8px;position:relative;z-index:1}
.ids-wb i{width:14px;height:14px;border-radius:50%;background:#555;display:block}
.ids-wb i.x{background:#e95420}
.ids-tbody{flex:1;position:relative;min-height:0;display:flex}
.ids-term{flex:1;overflow:auto;padding:10px 12px;font:500 13.5px/1.42 var(--mono);background:#071a0e;color:#45dd68;cursor:text;outline:none}
.ids-term .ln{white-space:pre-wrap;word-break:break-word;min-height:1.42em}
.ids-irow{display:flex;align-items:baseline}
.ids-irow .ps1{white-space:pre;color:#88ffb0}
.ids-irow input{flex:1;border:0;outline:0;background:transparent;font:inherit;padding:0;color:#45dd68;caret-color:#45dd68;min-width:40px}
.ids-irow.busy .ps1{display:none}
.ids-irow.busy input{caret-color:transparent!important}
.ids-term .l-bad{color:#ff8575}.ids-term .l-warn{color:#ecc06a}.ids-term .l-dim{color:#7fae8c}.ids-term .l-cmd{color:#9dffc2}
/* nano / vi editor pane */
.ids-ed{position:absolute;inset:0;display:flex;flex-direction:column;font:500 13.5px/1.42 var(--mono);background:#071a0e;color:#45dd68}
.ids-ed-hd{background-color:currentColor;padding:1px 0;white-space:pre}
.ids-ed-hdin{display:flex;justify-content:space-between;color:#071a0e;font-weight:600;padding:0 8px}
.ids-ed-ta{flex:1;border:0;outline:0;resize:none;background:transparent!important;color:inherit;caret-color:currentColor;font:inherit;padding:2px 8px;white-space:pre;overflow:auto;tab-size:8}
.ids-ed-ta::selection{background:#45dd68;color:#071a0e}
.ids-ed-help{flex:1;overflow:auto;padding:4px 8px;white-space:pre-wrap}
.ids-ed-st{min-height:1.42em;text-align:center;white-space:pre}
.ids-ed-st .inv{background-color:#45dd68;color:#071a0e;padding:0 4px}
html.tt-white .ids-ed-st .inv{background-color:#e7eef1}
.ids-ed-st.prompt{text-align:left;background-color:currentColor}
.ids-ed-st.prompt span{color:#071a0e;padding:0 8px;display:block}
.ids-ed-st .cur{display:inline-block;width:.6em;background:#071a0e;animation:idsBlink 1s steps(1) infinite}
@keyframes idsBlink{50%{opacity:0}}
.ids-ed-ft{display:grid;grid-template-columns:repeat(6,1fr);white-space:pre;padding:0 2px 2px;font-size:12.5px}
.ids-ed-ft span{cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.ids-ed-ft span:hover{text-decoration:underline}
.ids-ed-ft b{background-color:#45dd68;color:#071a0e;font-weight:600;padding:0 1px}
html.tt-white .ids-ed-ft b{background-color:#e7eef1}
.ids-ed.vi .ids-ed-hd,.ids-ed.vi .ids-ed-ft{display:none}
.ids-ed.vi .ids-ed-st{text-align:left;padding:0 8px}
.ids-keys{font:500 12px var(--display);color:var(--muted);padding:6px 2px 0;line-height:1.7}
.ids-keys kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.ids-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#2a2416;color:#fff;font:600 13.5px var(--display);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
.ids-toast.show{opacity:1;transform:translateX(-50%)}
.ids-res td.why{color:var(--muted);font-size:12px}
.ids-task .ids-obj code{font:600 12px var(--mono)}
.ids-req code{font:600 12.5px var(--mono)}

.card h2{font-size:19px}
.ids-sub{font-size:14px}

.snp-facts b{display:block;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.snp-facts .mono{font-size:12.5px}
/* terminal chrome */
.ids-twin{border-color:var(--snp-black)}
.ids-tbar{background:linear-gradient(#34353a,#1a1b1e);border-bottom:2px solid var(--snp-red)}
.ids-tbtn{border-color:#4a4b50;background:var(--snp-char2);color:#eee}
.ids-tbtn:hover{background:var(--snp-red);border-color:var(--snp-red)}
.ids-wb i{background:#4d4e53}.ids-wb i.x{background:var(--snp-red)}
.snp-bar{display:flex;align-items:center;gap:12px;background:var(--snp-black);color:#bfc0c4;padding:4px 12px;font:600 11.5px/1.4 var(--mono);border-bottom:1px solid #000;white-space:nowrap;overflow:hidden}
.snp-bar-w{font:900 13px/1 var(--display);letter-spacing:.12em;color:#fff;border-left:4px solid var(--snp-red);padding-left:7px}
.snp-bar-t{overflow:hidden;text-overflow:ellipsis}
/* alert table header */
.ids-al th{background:var(--snp-char);color:#f1f1f3;border-bottom:2px solid var(--snp-red)}

.snp-logo{display:flex;align-items:center;gap:14px}
.snp-logo img{display:block;width:100%;max-width:300px;height:auto;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.08)}
.snp-logo .snp-word{font-size:40px}
.snp-bar-logo{width:18px;height:18px;background:#fff;border-radius:4px;padding:1px;margin-right:6px;vertical-align:middle}

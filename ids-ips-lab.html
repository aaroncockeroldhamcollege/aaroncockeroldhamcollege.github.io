<!doctype html>
<html lang="en-GB"><head><meta name="flat-layout" content="1"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="favicon.svg" type="image/svg+xml"><script>try{var t=localStorage.getItem("labs-theme");if(t)document.documentElement.setAttribute("data-theme",t);if(localStorage.getItem("labs-term")==="white")document.documentElement.classList.add("tt-white");}catch(e){}</script><script>/* ============================================================
   Network topology symbols — shared across every activity.
   Original SVG drawings in the conventional Cisco/Packet Tracer
   topology style (functional diagram symbols). viewBox 0 0 64 64,
   device centred. Two-tone: light body + Cisco-blue outline, so
   they read on both light and dark stages.
   Use:  <svg viewBox="0 0 64 64">  + NETSYM[type]  </svg>
============================================================ */
(function(){
  // palette (fixed so icons look identical on every page/theme)
  var B='#cfe7f5',   // body fill
      L='#0a7cad',   // outline
      A='#0a9ad4',   // accent fill
      D='#07485f',   // deep accent
      W='#ffffff';
  function arrow(d){ return '<path d="'+d+'" fill="none" stroke="'+W+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'; }

  var S={};

  // ---- Router: 3-D cylinder with the classic 4-way arrows on top ----
  S.router =
   '<path d="M8 34 v4 a24 8 0 0 0 48 0 v-4" fill="'+L+'"/>'+
   '<ellipse cx="32" cy="34" rx="24" ry="8.5" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   // 4-way arrows (left,right,up,down) on the top face
   arrow('M20 34 h9 m-3.5 -3 l3.5 3 -3.5 3')+        // right
   arrow('M44 34 h-9 m3.5 -3 l-3.5 3 3.5 3')+        // left
   arrow('M32 27.5 v-3 M29.5 26 l2.5 -2.5 2.5 2.5')+ // up (small)
   arrow('M32 40.5 v3 M29.5 42 l2.5 2.5 2.5 -2.5');  // down (small)

  // ---- Switch: flat 3-D slab with 4 parallel arrows (2 each way) ----
  S['switch'] =
   '<path d="M10 30 L22 22 H58 L46 30 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+   // top face
   '<path d="M10 30 H46 V40 H10 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+          // front
   '<path d="M46 30 L58 22 V32 L46 40 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+    // side
   arrow('M16 33 h16 m-4 -2.5 l4 2.5 -4 2.5')+
   arrow('M40 37 h-16 m4 -2.5 l-4 2.5 4 2.5');

  // ---- Multilayer (L3) switch: slab + routing ring ----
  S.l3switch =
   '<path d="M10 32 L22 24 H58 L46 32 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M10 32 H46 V42 H10 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M46 32 L58 24 V34 L46 42 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   arrow('M16 35 h12 m-3.5 -2.5 l3.5 2.5 -3.5 2.5')+
   arrow('M40 39 h-12 m3.5 -2.5 l-3.5 2.5 3.5 2.5')+
   '<circle cx="47" cy="20" r="9" fill="'+W+'" stroke="'+L+'" stroke-width="2"/>'+
   arrow('M43 20 h8 m-2.5 -2.5 l2.5 2.5 -2.5 2.5').replace(/#ffffff/,L);

  // ---- PC / desktop: monitor + tower ----
  S.pc =
   '<rect x="12" y="14" width="34" height="24" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="16" y="18" width="26" height="16" rx="1" fill="'+A+'"/>'+
   '<rect x="25" y="38" width="8" height="5" fill="#9bbdd4"/>'+
   '<rect x="18" y="43" width="22" height="4" rx="2" fill="'+L+'"/>'+
   '<rect x="48" y="20" width="12" height="27" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<circle cx="54" cy="25" r="1.6" fill="'+L+'"/><path d="M51 42 h6" stroke="'+L+'" stroke-width="2"/>';

  // ---- Laptop ----
  S.laptop =
   '<path d="M16 16 h32 v20 h-32 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="19" y="19" width="26" height="14" rx="1" fill="'+A+'"/>'+
   '<path d="M10 44 L16 36 h32 l6 8 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M27 40 h10" stroke="'+L+'" stroke-width="2" stroke-linecap="round"/>';

  // ---- Server ----
  S.server =
   '<rect x="20" y="10" width="24" height="44" rx="3" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="24" y="15" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="18.5" r="1.4" fill="'+W+'"/>'+
   '<rect x="24" y="25" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="28.5" r="1.4" fill="'+W+'"/>'+
   '<rect x="24" y="35" width="16" height="7" rx="1" fill="'+A+'"/><circle cx="41" cy="38.5" r="1.4" fill="'+W+'"/>'+
   '<path d="M25 48 h14" stroke="'+L+'" stroke-width="2" stroke-linecap="round"/>';

  // ---- Firewall: brick wall ----
  S.firewall =
   '<rect x="8" y="16" width="48" height="32" rx="2" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<g stroke="'+L+'" stroke-width="2">'+
   '<path d="M8 27 h48 M8 37 h48"/>'+
   '<path d="M24 16 v11 M40 16 v11"/>'+        // top row bricks
   '<path d="M16 27 v10 M32 27 v10 M48 27 v10"/>'+ // mid row offset
   '<path d="M24 37 v11 M40 37 v11"/>'+        // bottom row
   '</g>';

  // ---- Access point: puck + radio waves ----
  S.ap =
   '<ellipse cx="32" cy="42" rx="22" ry="7" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="30" y="20" width="4" height="18" rx="2" fill="'+L+'"/>'+
   '<circle cx="32" cy="18" r="3.5" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   '<g fill="none" stroke="'+A+'" stroke-width="2.4" stroke-linecap="round">'+
   '<path d="M22 14 a14 14 0 0 1 20 0"/><path d="M26 18 a9 9 0 0 1 12 0"/></g>';

  // ---- IP phone ----
  S.phone =
   '<path d="M18 12 h24 a4 4 0 0 1 4 4 v30 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 v-30 a4 4 0 0 1 4 -4 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="19" y="17" width="22" height="13" rx="1" fill="'+A+'"/>'+
   '<g fill="'+L+'"><circle cx="23" cy="36" r="2"/><circle cx="30" cy="36" r="2"/><circle cx="37" cy="36" r="2"/><circle cx="23" cy="43" r="2"/><circle cx="30" cy="43" r="2"/><circle cx="37" cy="43" r="2"/></g>';

  // ---- Printer ----
  S.printer =
   '<rect x="18" y="12" width="28" height="12" rx="1" fill="'+B+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="10" y="24" width="44" height="18" rx="3" fill="'+A+'" stroke="'+L+'" stroke-width="2"/>'+
   '<rect x="20" y="36" width="24" height="14" rx="1" fill="'+W+'" stroke="'+L+'" stroke-width="2"/>'+
   '<circle cx="48" cy="30" r="2" fill="'+W+'"/>';

  // ---- Cloud (internet / WAN) ----
  S.cloud =
   '<path d="M16 46 a12 12 0 0 1 1 -24 a15 14 0 0 1 28 -4 a12 12 0 0 1 4 28 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>';

  // ---- Hub: plain 3-D box with vertical slats (no arrows — it just repeats) ----
  S.hub =
   '<path d="M14 24 L24 17 H54 L44 24 Z" fill="'+A+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M14 24 H44 V46 H14 Z" fill="'+B+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M44 24 L54 17 V39 L44 46 Z" fill="'+L+'" stroke="'+L+'" stroke-width="2" stroke-linejoin="round"/>'+
   '<path d="M20 29v12M26 29v12M32 29v12M38 29v12" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/>';

  // aliases
  S.multiswitch=S.l3switch; S.asa=S.firewall; S.internet=S.cloud; S.desktop=S.pc;

  window.NETSYM=S;
})();
</script>

<title>IDS / IPS Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#f7f3e8; --panel:#fff; --ink:#2a2416; --muted:#6e6450; --line:#e8dcbd; --accent:#d9a51e; --accent-dark:#8c6400; --accent-soft:#fdf1c7;
  --ok:#1a9c5b; --oks:#e7f6ec; --bad:#d23d3d; --bads:#fbe9e9; --warn:#e68a00;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --display:"Chivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130d;--panel:#1f1c14;--ink:#f1ead8;--muted:#b3a98f;--line:#3a3424;--accent:#f2c94c;--accent-dark:#f7d978;--accent-soft:#3d3110;--oks:#13331f;--bads:#3a1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130d;--panel:#1f1c14;--ink:#f1ead8;--muted:#b3a98f;--line:#3a3424;--accent:#f2c94c;--accent-dark:#f7d978;--accent-soft:#3d3110;--oks:#13331f;--bads:#3a1c1c;color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--ink)}body{margin:0;font:14px/1.5 var(--display)}
button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:18px 16px 44px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}
h1{font:800 clamp(24px,4vw,32px)/1.05 var(--display);margin:6px 0 0}
.lead{color:var(--muted);margin:8px 0 0;max-width:76ch}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font:800 18px var(--display);margin:0 0 4px}.card h3{font:700 12px var(--display);margin:14px 0 6px;color:var(--accent-dark);text-transform:uppercase;letter-spacing:.04em}
.ref{font-size:13.5px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.lvl{border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:center}
.lvl .n{font:800 22px var(--mono)}.lvl b{display:block;font:700 13px var(--display)}.lvl span{font-size:12px;color:var(--muted)}
.lvl.in{border-color:var(--ok)}.lvl.in .n{color:var(--ok)}
.lvl.dmz{border-color:var(--warn)}.lvl.dmz .n{color:var(--warn)}
.lvl.out{border-color:var(--bad)}.lvl.out .n{color:var(--bad)}
.rule{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:8px 12px;margin:7px 0;font-size:13.5px}
.rule b{color:var(--accent-dark)}
.acl{font:600 13px/1.5 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.acl .p{color:var(--ok);font-weight:700}.acl .d{color:var(--bad);font-weight:700}
.btn{font:600 13px var(--display);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.primary:hover{background:var(--accent-dark)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scorebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font:600 12px var(--mono);color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:120px}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.score{font:800 16px var(--display)}
.q .stem{font-weight:700;margin:2px 0 4px;font-size:15px}
.q .stem .ip{font:700 15px var(--mono);color:var(--accent-dark)}
.flow{font:700 14px var(--mono);background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;display:inline-block}
.opts{display:grid;gap:7px;margin-top:9px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;font:600 13.5px var(--display)}
.opt .mono{font-family:var(--mono)}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--oks)}.opt.wrong{border-color:var(--bad);background:var(--bads)}
.fb{margin-top:10px;border-radius:9px;padding:10px 13px;font-size:13.5px;display:none}.fb.show{display:block}
.fb.ok{background:var(--oks);border:1px solid var(--ok)}.fb.no{background:var(--bads);border:1px solid var(--bad)}

/* ===================== tabs ===================== */
.app.wide{max-width:1560px}
.ids-tabs{display:flex;gap:6px;margin:16px 0 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.ids-tab{border:1px solid var(--line);border-bottom:0;background:transparent;padding:10px 16px 9px;border-radius:10px 10px 0 0;font:700 14px var(--display);cursor:pointer;color:var(--muted);margin-bottom:-2px;display:flex;align-items:center;gap:8px}
.ids-tab:hover{color:var(--ink)}
.ids-tab .n{font:700 11px/1 var(--mono);background:var(--line);color:var(--ink);border-radius:999px;padding:4px 7px}
.ids-tab.on{color:var(--accent-dark);background:var(--panel);border-color:var(--line);border-bottom:2px solid var(--panel)}
.ids-tab.on .n{background:var(--accent);color:var(--on-accent)}
.ids-hide{display:none!important}
.mono{font-family:var(--mono)}
.ids-sub{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.ids-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.ids-seg button{border:0;background:transparent;padding:8px 13px;font:600 13px var(--display);cursor:pointer;color:var(--ink)}
.ids-seg button+button{border-left:1px solid var(--line)}
.ids-seg button.on{background:var(--accent);color:var(--on-accent)}
.ids-pill{display:inline-block;font:600 11.5px var(--mono);border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.ids-pill.ok{border-color:var(--ok);color:var(--ok);background:var(--oks)}
.ids-pill.bad{border-color:var(--bad);color:var(--bad);background:var(--bads)}

/* ===================== rule practice ===================== */
.ids-scn{font:700 16px/1.45 var(--display);background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin:10px 0 12px}
.ids-scn .mono{font-size:15px;color:var(--accent-dark)}
.ids-net{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:4px 0 0}
.ids-net b{color:var(--ink);font-weight:700}
.ids-bld{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;margin-top:6px}
.ids-f{display:flex;flex-direction:column;gap:4px}
.ids-f>label{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ids-f.wide{grid-column:span 2}
.ids-in,.ids-sel{font:600 13.5px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.ids-sel{font-family:var(--display);cursor:pointer}
.ids-in.bad,.ids-sel.bad{border-color:var(--bad);background:var(--bads)}
.ids-in.ok,.ids-sel.ok{border-color:var(--ok);background:var(--oks)}
.ids-pair{display:flex;gap:6px}
.ids-prev{margin-top:12px;background:#071a0e;color:#45dd68;border-radius:9px;padding:10px 13px;font:600 13.5px/1.6 var(--mono);overflow-x:auto;white-space:pre}
.ids-prev .c{color:#7fae8c}
.ids-type{width:100%;font:600 14px var(--mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 11px}
.ids-fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:13.5px;display:none}
.ids-fb.show{display:block}.ids-fb.ok{background:var(--oks);border:1px solid var(--ok)}.ids-fb.no{background:var(--bads);border:1px solid var(--bad)}.ids-fb.info{background:var(--accent-soft);border:1px solid var(--accent)}
.ids-fb ul{margin:6px 0 0;padding-left:20px}.ids-fb li{margin:2px 0}
.ids-fb code{font:600 12.5px var(--mono)}
/* order puzzle */
.ids-acl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ids-ace{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 9px;font:600 13px var(--mono);cursor:grab;transition:background .15s,border-color .15s}
.ids-ace.drag{opacity:.4}.ids-ace.over{border-color:var(--accent);box-shadow:0 -3px 0 var(--accent)}
.ids-ace .no{flex:none;width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-size:12px}
.ids-ace .tx{flex:1;overflow-wrap:anywhere}
.ids-ace .tx .p{color:var(--ok)}.ids-ace .tx .d{color:var(--bad)}
.ids-ace .mv{display:flex;gap:4px}
.ids-ace .mv button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:28px;height:26px;cursor:pointer;color:var(--ink)}
.ids-ace .mv button:hover{border-color:var(--accent)}
.ids-ace.hit-p{border-color:var(--ok);background:var(--oks)}.ids-ace.hit-d{border-color:var(--bad);background:var(--bads)}
.ids-ace.imp{cursor:default;color:var(--muted);border-style:dashed}
.ids-tests{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.ids-tests th{text-align:left;font:700 11px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
.ids-tests td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.ids-tests td.m{font:600 12.5px var(--mono)}
.ids-tests tr.pass td:last-child{color:var(--ok);font-weight:800}.ids-tests tr.fail td:last-child{color:var(--bad);font-weight:800}

/* ===================== configure tab ===================== */
.ids-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ids-bar .sp{flex:1}
.ids-task{margin-top:12px}
.ids-task h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ids-brief{font-size:13.5px;margin:4px 0 8px;max-width:110ch}
.ids-objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:7px}
.ids-obj{border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 34px;position:relative;font-size:13px;background:var(--panel)}
.ids-obj::before{content:"";position:absolute;left:10px;top:9px;width:15px;height:15px;border-radius:50%;border:2px solid var(--line)}
.ids-obj.done{border-color:var(--ok);background:var(--oks)}
.ids-obj.done::before{background:var(--ok);border-color:var(--ok)}
.ids-obj.done::after{content:"✓";position:absolute;left:13px;top:6px;color:#fff;font:800 12px var(--display)}
.ids-obj.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ids-obj b{font-weight:700}
.ids-obj .auto{font:600 10.5px var(--mono);color:var(--accent-dark);margin-left:6px}
.ids-obj details{margin-top:4px}
.ids-obj summary{cursor:pointer;color:var(--accent-dark);font:600 12px var(--display)}
.ids-obj .why{color:var(--muted);font-size:12.5px;margin:3px 0}
.ids-cmds{font:600 12.5px/1.55 var(--mono);background:#071a0e;color:#9dffc2;border-radius:7px;padding:7px 10px;margin-top:5px;white-space:pre;overflow-x:auto}
.ids-done{display:none;margin-top:10px;border:1px solid var(--ok);background:var(--oks);border-radius:10px;padding:10px 14px}
.ids-done.show{display:block}
.ids-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:1050px){.ids-grid{grid-template-columns:1fr}}
.ids-tcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}
.ids-thead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font:700 13px var(--display)}
.ids-thead .sp{flex:1}

:root{--on-accent:#3b2a00;--sheen:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 110px);--hdr-title:#6b4d00;--gloss:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.28) 49%,rgba(255,255,255,0) 51%,rgba(0,0,0,.03) 100%);
  --sk-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(80,60,10,.10),0 12px 28px -12px rgba(80,60,10,.22);
  --sk-btn-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(120,90,10,.08),0 1px 2px rgba(80,60,10,.18)}
html body{background:
  radial-gradient(1100px 520px at -5% -10%,rgba(255,206,84,.30),transparent 62%),
  radial-gradient(900px 480px at 105% -6%,rgba(255,233,170,.60),transparent 64%),
  radial-gradient(800px 600px at 50% 120%,rgba(255,224,140,.22),transparent 60%),
  linear-gradient(180deg,#fbf8ef 0%,#f3ecda 100%) fixed;background-color:#f6f1e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-accent:#2a2000;--sheen:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 110px);--hdr-title:#f7d978;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 49%,rgba(255,255,255,0) 51%,rgba(0,0,0,.12) 100%);
  --sk-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(0,0,0,.6);
  --sk-btn-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.5)}
  html:not([data-theme="light"]) body{background:radial-gradient(1100px 520px at -5% -10%,rgba(242,201,76,.10),transparent 62%),radial-gradient(900px 480px at 105% -6%,rgba(242,201,76,.07),transparent 64%),linear-gradient(180deg,#17140d 0%,#0f0d08 100%) fixed;background-color:#13110b}}
:root[data-theme="dark"]{--on-accent:#2a2000;--sheen:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 110px);--hdr-title:#f7d978;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 49%,rgba(255,255,255,0) 51%,rgba(0,0,0,.12) 100%);
  --sk-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(0,0,0,.6);

html[data-theme="dark"] body{background:radial-gradient(1100px 520px at -5% -10%,rgba(242,201,76,.10),transparent 62%),radial-gradient(900px 480px at 105% -6%,rgba(242,201,76,.07),transparent 64%),linear-gradient(180deg,#17140d 0%,#0f0d08 100%) fixed;background-color:#13110b}

/* Aero-glass site header */
.site-hdr{background:linear-gradient(180deg,rgba(255,255,255,.92) 0%,rgba(255,250,232,.82) 48%,rgba(253,240,200,.78) 52%,rgba(250,236,196,.86) 100%)!important;
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  border-bottom:1px solid rgba(170,130,30,.35)!important;box-shadow:inset 0 1px 0 #fff,0 6px 22px -10px rgba(120,90,10,.35)}
html[data-theme="dark"] .site-hdr{background:linear-gradient(180deg,rgba(52,46,30,.92),rgba(34,30,19,.9) 50%,rgba(26,23,15,.92))!important;border-bottom-color:rgba(242,201,76,.35)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 22px -10px rgba(0,0,0,.7)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .site-hdr{background:linear-gradient(180deg,rgba(52,46,30,.92),rgba(34,30,19,.9) 50%,rgba(26,23,15,.92))!important;border-bottom-color:rgba(242,201,76,.35)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 22px -10px rgba(0,0,0,.7)}}
.site-hdr .logo-ol{border-radius:10px!important;box-shadow:0 1px 3px rgba(80,60,10,.25),inset 0 0 0 1px rgba(0,0,0,.04)}
.site-word{display:flex;flex-direction:column;line-height:1.05;font-family:"Chivo",system-ui,sans-serif}
.site-word b{font-size:19px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(180deg,#a87500,#6b4a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.site-word small{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8a7a55}
html[data-theme="dark"] .site-word b{background:linear-gradient(180deg,#ffe28a,#e0b030);-webkit-background-clip:text;background-clip:text}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .site-word b{background:linear-gradient(180deg,#ffe28a,#e0b030);-webkit-background-clip:text;background-clip:text}}
.site-hdr .site-title{color:var(--hdr-title)!important;font-size:15px!important}
.site-ctl,.site-hdr .site-link{border-radius:10px!important;background:linear-gradient(180deg,#fffdf6 0%,#fbf1d4 50%,#f6e6b6 51%,#f9ecc6 100%)!important;border:1px solid #d9c07a!important;color:#6b4d00!important;box-shadow:var(--sk-btn-shadow)}
.site-ctl:hover,.site-hdr .site-link:hover{background:linear-gradient(180deg,#fffef9 0%,#fff3cf 50%,#ffe39a 51%,#ffeab0 100%)!important;border-color:#c9a24a!important}
html[data-theme="dark"] .site-ctl,html[data-theme="dark"] .site-hdr .site-link{background:linear-gradient(180deg,#3a3322,#2a251a 50%,#221e15 51%,#2a251a)!important;border-color:#5a4e30!important;color:#f7d978!important}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .site-ctl,html:not([data-theme="light"]) .site-hdr .site-link{background:linear-gradient(180deg,#3a3322,#2a251a 50%,#221e15 51%,#2a251a)!important;border-color:#5a4e30!important;color:#f7d978!important}}
.wb-fab{background:radial-gradient(120% 90% at 50% 0%,#fff3c4 0%,#ffd75e 38%,#e8ab18 70%,#c98c0a 100%)!important;color:#3b2a00!important;border:1px solid #b98510!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 22px -6px rgba(150,100,0,.55)!important;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.wb-fab:hover{filter:brightness(1.05)}

/* softer, glossier building blocks (site UI only — tool facsimiles keep their own look) */
.card,[class$="-card"],[class*="-card "],[class$="-tcard"],.lab-card{border-radius:16px;box-shadow:var(--sk-shadow);
  background-image:var(--sheen)}
.btn,[class$="-btn"],[class*="-btn "],[class$="-ib"],[class$="-seg"]>button,[class$="-tab"]{background-image:var(--gloss);box-shadow:var(--sk-btn-shadow)}
.btn,[class$="-btn"],[class*="-btn "],[class$="-ib"]{border-radius:10px}
[class$="-seg"]{border-radius:11px;box-shadow:inset 0 1px 2px rgba(80,60,10,.14),0 1px 0 rgba(255,255,255,.7)}
[class$="-tab"]{border-radius:12px 12px 0 0}
[class$="-obj"],[class$="-scard"],[class$="-item"]{border-radius:12px}
